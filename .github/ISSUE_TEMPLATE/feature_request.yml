name: Feature request
description: Something mandor should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where mandor got in the way or fell short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The behavior you would like, as a user would see it. A command, an option or an example helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, and how you work around it today.
  - type: textarea
    id: reach
    attributes:
      label: Effect on what workers can reach
      description: If this gives workers a wider environment, a writable path or a weaker guard, say why that is safe. Otherwise leave it empty.
