version: 2
updates:
  # The workflows pin each action to a commit, so something has to move the pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The types follow the oldest supported Node, so the type check refuses an API that Node 22 lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
